name: Maps Main Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  id-token: write

concurrency:
  group: maps-main-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Maps Release Candidate
    uses: ./.github/workflows/build.yml
    secrets: inherit

  publish:
    name: Publish Maps Image to ECR
    needs: verify
    if: needs.verify.result == 'success'
    uses: ./.github/workflows/publish-ecr.yml
    secrets: inherit

  update-gitops:
    name: Update GitOps repo
    needs: publish
    uses: KDT-TravelPlanner/travel-gitops/.github/workflows/update-gitops.yml@develop
    secrets:
      GITOPS_APP_ID: ${{ secrets.GITOPS_APP_ID }}
      GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
    with:
      service-name: maps
      image-ref: ${{ needs.publish.outputs.image_ref }}
      deployment-patch-path: k8s/overlays/dev-eks/workload/maps/deployment.patch.yaml
