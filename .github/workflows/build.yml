name: Maps 도커 이미지 및 HTTP Adapter 검증

on:
  pull_request:
    branches: [develop, main]
  push:
    branches:
      - "codex/**"
      - "fix/**"
      - "SCRUM-*"

permissions:
  contents: read
  packages: read
  id-token: write

concurrency:
  group: maps-docker-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_DB: travel_diary_dev
          POSTGRES_USER: travel_diary
          POSTGRES_PASSWORD: travel_diary_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travel_diary -d travel_diary_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 1단계 단위 테스트
        env:
          GITHUB_PACKAGES_USER: ${{ secrets.COMMON_PACKAGES_USER }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.COMMON_PACKAGES_TOKEN }}
        run: ./gradlew clean test --no-daemon

      - name: 2단계 통합 테스트
        env:
          GITHUB_PACKAGES_USER: ${{ secrets.COMMON_PACKAGES_USER }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.COMMON_PACKAGES_TOKEN }}
        run: ./gradlew integrationTest --no-daemon

      - name: 3단계 HTTP Adapter 테스트
        env:
          GITHUB_PACKAGES_USER: ${{ secrets.COMMON_PACKAGES_USER }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.COMMON_PACKAGES_TOKEN }}
        run: ./gradlew adapterTest --no-daemon

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maps-test-reports
          path: |
            build/reports/tests
            build/test-results
          if-no-files-found: warn
          retention-days: 7

      - name: 애플리케이션 JAR 생성
        env:
          GITHUB_PACKAGES_USER: ${{ secrets.COMMON_PACKAGES_USER }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.COMMON_PACKAGES_TOKEN }}
        run: ./gradlew bootJar --no-daemon

      - name: 4단계 도커 이미지 빌드
        run: docker build --tag maps-service:ci .

      - name: ECR Push용 이미지 보관
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.ECR_PUSH_ENABLED == 'true'
        run: docker save maps-service:ci --output "${RUNNER_TEMP}/maps-service-ci.tar"

      - name: ECR Push용 이미지 artifact 업로드
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.ECR_PUSH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: maps-service-ci-image
          path: ${{ runner.temp }}/maps-service-ci.tar
          retention-days: 1

      - name: 5-6단계 도커 컨테이너 기동 및 Health 검증
        run: |
          set -euo pipefail
          docker run -d --name maps-service-ci \
            --add-host host.docker.internal:host-gateway \
            -p 18082:8080 \
            -p 19092:9091 \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e JWT_ISSUER=identity-service \
            -e JWT_SECRET=ci-only-jwt-secret-with-at-least-32-bytes \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/travel_diary_dev \
            -e SPRING_DATASOURCE_USERNAME=travel_diary \
            -e SPRING_DATASOURCE_PASSWORD=travel_diary_password \
            -e SPRING_DATA_REDIS_HOST=host.docker.internal \
            -e SPRING_DATA_REDIS_PORT=6379 \
            -e SPRING_DATA_REDIS_PASSWORD= \
            -e LOGGING_FILE_NAME=/var/log/travel-planner/travel-planner.log \
            maps-service:ci

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:19092/actuator/health/readiness >/dev/null 2>&1; then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              echo "readiness 대기 120초 초과" >&2
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent http://127.0.0.1:19092/actuator/health \
            | jq --exit-status '.status == "UP"' >/dev/null
          curl --fail --silent http://127.0.0.1:19092/actuator/health/readiness \
            | jq --exit-status '.status == "UP"' >/dev/null
          curl --fail --silent http://127.0.0.1:18082/api/ping \
            | jq --exit-status '.status == "ok" and .profile == "prod"' >/dev/null

      - name: 컨테이너 재시작 여부 확인
        run: |
          set -euo pipefail
          restart_count="$(docker inspect --format '{{.RestartCount}}' maps-service-ci)"
          test "${restart_count}" = "0"

      - name: 진단 로그 수집
        if: failure()
        run: |
          mkdir -p "${RUNNER_TEMP}/container-diagnostics"
          docker logs maps-service-ci > "${RUNNER_TEMP}/container-diagnostics/app.log" 2>&1 || true
          docker inspect maps-service-ci > "${RUNNER_TEMP}/container-diagnostics/inspect.json" 2>&1 || true

      - name: 진단 로그 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maps-container-diagnostics
          path: ${{ runner.temp }}/container-diagnostics
          if-no-files-found: warn
          retention-days: 7

      - name: 도커 컨테이너 정리
        if: always()
        run: docker rm -f maps-service-ci 2>/dev/null || true

  push-ecr:
    name: ECR 이미지 Push
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.ECR_PUSH_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_MAPS_REPOSITORY }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
    steps:
      - name: ECR 설정값 확인
        run: |
          set -euo pipefail
          test -n "${AWS_REGION}" || { echo "AWS_REGION variable is required" >&2; exit 1; }
          test -n "${ECR_REPOSITORY}" || { echo "ECR_MAPS_REPOSITORY variable is required" >&2; exit 1; }
          test -n "${AWS_ROLE_TO_ASSUME}" || { echo "AWS_ROLE_TO_ASSUME secret is required" >&2; exit 1; }

      - name: AWS OIDC 자격 증명
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}

      - name: Amazon ECR 로그인
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: 이미지 artifact 다운로드
        uses: actions/download-artifact@v4
        with:
          name: maps-service-ci-image
          path: ${{ runner.temp }}/maps-service-image

      - name: 이미지 Push
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          docker load --input "${RUNNER_TEMP}/maps-service-image/maps-service-ci.tar"
          image="${REGISTRY}/${ECR_REPOSITORY}"
          docker tag maps-service:ci "${image}:${GITHUB_SHA}"
          docker push "${image}:${GITHUB_SHA}"
